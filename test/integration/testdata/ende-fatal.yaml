format: pgwire-recorder
version: 2
sessions:
  - id: 1
    interactions:
      - sequence: 1
        request: {type: query, sql: "SELECT 1;"}
        responses:
          - {type: command_complete, tag: SELECT 1}
          - {type: ready_for_query, tx_status: I}
      - sequence: 2
        request: {type: query, sql: "SELECT 2;"}
        responses:
          - {type: error_response, notice: {V: FATAL, S: FATAL, C: 57P01, M: terminating connection due to administrator command}}
          - {type: connection_closed}
  - id: 2
    interactions:
      - sequence: 1
        request: {type: query, sql: "SELECT 3;"}
        responses:
          - {type: command_complete, tag: SELECT 3}
          - {type: ready_for_query, tx_status: I}
