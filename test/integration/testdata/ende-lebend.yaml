format: pgwire-recorder
version: 2
sessions:
  - id: 1
    interactions:
      - sequence: 1
        request: {type: query, sql: "-- ping"}
        responses:
          - {type: error_response, notice: {V: FATAL, S: FATAL, C: 57P05, M: terminating connection due to idle-session timeout}}
          - {type: connection_closed}
  - id: 2
    interactions:
      - sequence: 1
        request: {type: query, sql: "SELECT 3;"}
        responses:
          - {type: command_complete, tag: SELECT 3}
          - {type: ready_for_query, tx_status: I}
