format: pgwire-recorder
version: 1
sessions:
  - id: 1
    startup:
      database: postgres
      user: postgres
    server_parameters:
      DateStyle: ISO, MDY
      client_encoding: UTF8
      integer_datetimes: "on"
      server_encoding: UTF8
      server_version: "17.11"
      standard_conforming_strings: "on"
    interactions:
      - sequence: 1
        request:
          type: query
          sql: SELECT 1;
        responses:
          - type: row_description
            fields:
              - name: '?column?'
                table_oid: 0
                column_number: 0
                type_oid: 23
                type_size: 4
                type_modifier: -1
                format: 0
          - type: data_row
            values:
              - text: "1"
          - type: command_complete
            tag: SELECT 1
          - type: ready_for_query
            tx_status: I
  - id: 2
    server_parameters:
      client_encoding: UTF8
      server_version: "17.11"
    interactions:
      - sequence: 1
        request:
          type: query
          sql: SELECT 2;
        responses:
          - type: command_complete
            tag: SELECT 1
          - type: ready_for_query
            tx_status: I
