# Doku-Referenz-Gate — emittiert von ai-harness-init (Adopter-Baseline).
# Startgeruest: `d-check --print-config`. Waechst mit den Artefakten:
# ids/codepaths erst aktivieren, wenn Targets/roots existieren — sonst
# Config-Fehler bzw. ein behaupteter, aber leerer Gate (Modul 13, LH-QA-01).
scan:
  roots: ["."]
  # .harness/**: tool-interne Ablage (gefetchtes Sprachskelett-Staging) —
  # keine Adopter-Doku, vom Doc-Gate ausgenommen.
  ignore: ["**/*.template.md", ".tmp/**", ".harness/**"]
modules: [links, anchors, ids, matrix, spans]
ids:
  patterns:
    - {regex: 'ADR-([A-Z]+-)?\d{4}', target: docs/plan/adr/, link-policy: always}
    # Requirement-Praefix gehoert dem Adopter (er ist in einem frischen Ziel nicht
    # bekannt) — Muster setzen und aktivieren, sobald spec/lastenheft.md eigene
    # Kennungen fuehrt: {regex: '<PREFIX>-[A-Z]{2}-\d{2}', target: spec/lastenheft.md, link-policy: always}
# codepaths bleibt aus — ihre Aktivierung ist eine eigene Entscheidung.
# codepaths:
#   roots: [spec, docs, harness]
# Herkunft der Positionen in diesem Block, gemessen gegen die Baseline-Vorlage
# (.harness/baseline/<tag>/templates/.d-check.yml) und gegen die Matrix-Tabelle in
# grundlagen-referenz-richtung.md. order:/direction: auf spec-straten und die Regel
# {from: adr, to: slice} stehen dort im auskommentierten matrix-Block und gehen mit.
# Die Baseline-Vorlage fuehrt fuer die slice-Klasse ein token: in der Ziffern-Form;
# hier steht das Praefix slice-, weil grundlagen-source-precedence.md §Vergabe Slice-
# und Welle-Kennungen als Namen setzt: das Praefix faengt den Namen und die Nummer.
# Fuenf Positionen gehen darueber hinaus:
# Die welle-Klasse samt dem Praefix welle- und die Regeln {from: adr, to: welle} und
# {from: spec-straten, to: welle}: Die Matrix-Tabelle setzt die Spalte Welle in der
# ADR-Zeile und in allen drei Straten-Zeilen; die Klasse steht vor aussen, also faengt
# aussen eine Welle-Datei nicht, und die Regel aus spec-straten ist die einzige Deckung.
# Das Praefix welle- ist die Setzung dieser Vorlage aus der Spalte Welle; der Gate-Text
# des Regelwerks nennt nur ADR- und slice-. exclude-sections traegt nur Geschichte,
# nicht Historie/"7. Historie": Die ADR-Vorlage fuehrt in ihrem Geschichte-Abschnitt
# eine Verweis-Spalte, deren erste Zeile eine Slice-Datei nennt — legitime
# rueckwaertige Provenance, die {from: adr, to: slice} sonst faelschlich faengt. Die
# Historie-Abschnitte der Spec-Straten-Vorlagen tragen keine solche Ausnahme: ihre
# eigene Decken-Regel verbietet dort jeden ADR-/Slice-Verweis ebenso wie ausserhalb der
# Historie, die Spalte "Verweis" fuehrt nur den externen Change Request.
# exclude-sections gilt in d-check fuer alle Klassen zugleich; je Klasse oder je Regel
# ist es nicht setzbar. Ein Abschnitt Geschichte in einer Spec-Datei nimmt dort Slice-
# und Welle-Token aus, was das Regelwerk fuer die Spec-Straten nicht vorsieht. Die
# emittierten Spec-Vorlagen fuehren keinen solchen Abschnitt (ihre Ueberschrift ist
# 7. Historie); wo ein Adopter ihn anlegt, faengt ihn nur der Reviewer.
# Die blosse Zeichenfolge ADR- ohne Nummer faengt keine Regel: sie steht als Wort in den
# emittierten Spec-Vorlagen, und das ids-Muster verlangt vier Ziffern.
# Die dritte ist die Klasse aussen als letzte Klasse samt der Regel aus spec-straten
# und dem exempt-paths-Block darunter: Sie schliesst die Referenz-Richtung nach
# aussen statt nur nach unten — ein Spec-Stratum nennt kein Artefakt ausserhalb der
# Spec. Die vierte ist die Klasse adaptionsblock samt token: 'MR-\d{3}' und ihrer
# Regel aus spec-straten: Sie faengt die Kennung des Adaptions-Blocks auch dort, wo
# sie blank im Fliesstext steht statt als Link. Die fuenfte ist die Bereichs-Form der
# ADR-Kennung: das ids-Muster nimmt ein optionales Segment (ADR-IDX-0004, so nennt
# §Vergabe die Form), und die adr-Klasse nimmt neben [0-9]*.md die Dateien mit
# Bereichs-Praefix auf; README.md traegt kein Segment und bleibt draussen.
# Das Praefix ist ein Fehlalarm fuer jedes Wort dieser Form (slice-mv, slice-lokal):
# die Vorlage nimmt ihn in Kauf. Der Ausweg ist je Klasse verschieden. In einer ADR
# nimmt der Zeilen-Marker <!-- d-check:status-provenance --> die Zeile aus. Der Marker
# ist nicht Ziel-spezifisch: er nimmt die Zeile fuer Slice und Welle zugleich aus. In
# einem Spec-Stratum hilft Umformulieren, denn das Regelwerk kennt dort keine
# ausgenommene Sektion; der Marker wirkt dort mechanisch ebenfalls und ist dann ein
# Umgehen, das nur der Reviewer faengt.
# Diese Datei wird nur an einem freien Pfad geschrieben: ein Ziel mit vorhandener
# .d-check.yml behaelt seine Fassung und bekommt keine dieser Positionen. Der Nachzug
# ist Handarbeit nach dieser Liste — die Praefix-Token slice- und welle-, die Regel
# {from: spec-straten, to: welle}, das segment-tolerante ids-Muster fuer ADR und der
# Bereichs-Praefix-Glob der adr-Klasse; die Regeln mit dem Adaptions-Block als Quelle
# fuehrt die Vorlage nicht.
# Eine Position bleibt bewusst hinter der Vorlage zurueck:
# token: 'ADR-\d{4}' auf der adr-Klasse geht NICHT mit — das
# ids-Modul deckt die blosse Kennung bereits ueber link-policy: always ab
# (id-unlinked), ein zweiter Fang ueber matrix waere redundant; fuer slice
# gibt es keine solche ids-Regel, darum bleibt dessen token: aktiv. Fuer MR ebenso
# wenig: ein ids-Muster darauf faerbt ein frisches Ziel rot, weil die emittierte
# harness/conventions.md ihre eigenen Kennungen blank nennt — der Fang laeuft darum
# ueber matrix, wo ihn die Regel aus spec-straten auf die Spec-Straten begrenzt.
matrix:
  classes:
    - {name: spec-straten, paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md], order: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md], direction: no-downward}
    - {name: adr, paths: ["docs/plan/adr/[0-9]*.md", "docs/plan/adr/[A-Z]*-[0-9]*.md"]}
    - {name: slice, paths: ["docs/plan/planning/**/slice-*.md"], token: 'slice-'}
    - {name: welle, paths: ["docs/plan/planning/**/welle-*.md"], token: 'welle-'}
    # Das Kennungs-Muster faengt die blosse MR-Kennung im Fliesstext, die kein
    # Link-Sensor sieht. Begrenzend ist die Regel darunter, nicht die Klassifikation:
    # Gefangen wird die Kennung nur in einer Quelle der Klasse spec-straten. Die
    # Index-Datei dieses Blocks nennt ihre eigenen Kennungen blank, und das bleibt
    # erlaubt.
    - {name: adaptionsblock, paths: ["harness/conventions.md", "harness/conventions/**"], token: 'MR-\d{3}'}
    # Letzte Klasse, First-Match: was keine fruehere faengt, ist aussen. Ein
    # Spec-Stratum nennt damit kein Artefakt ausserhalb der Spec, nicht nur keines
    # unterhalb. Die ** der slice- und der welle-Klasse bleiben stehen: Das Ziel
    # bekommt denselben Planning-Lifecycle, baut seinen Register-Bestand aber selbst
    # auf — eine engere Pfad-Liste waere hier eine Zusage ueber einen Dateibestand,
    # den an dieser Stelle niemand messen kann.
    - {name: aussen, paths: ["**"]}
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
    - {from: spec-straten, to: welle, allow: false}
    - {from: spec-straten, to: adaptionsblock, allow: false}
    - {from: spec-straten, to: aussen, allow: false}
    # Eine Accepted-ADR nennt eine Slice-/Welle-Kennung nur als deklarierte Provenance
    # (Baseline-Regelwerk grundlagen-referenz-richtung.md §Referenz-Richtung): der
    # Zeilen-Marker <!-- d-check:status-provenance --> nimmt die Zeile aus. Er ist der
    # vorgesehene Ausweg.
    - {from: adr, to: slice, allow: false}
    - {from: adr, to: welle, allow: false}
  status: {forbidden: [superseded, deprecated]}
  # Die Status-Pruefung trifft jede klassifizierte Quelle unabhaengig von den Regeln;
  # mit aussen: ["**"] ist das jede Datei. Ausgenommen sind zwei Pfade, die einen zum
  # Schreibzeitpunkt aktiven Stand dauerhaft nennen und einer spaeteren Supersession
  # nicht folgen koennen: der ADR-Index (er fuehrt superseded ADRs, das ist seine
  # Aufgabe) und die Review-Reports.
  # Die Welle-Dateien in done/ stehen hier bewusst NICHT: In einem frischen Ziel hat
  # eine solche Ausnahme keinen Gegenstand, und ab dem ersten geschlossenen Buendel
  # naehme sie der Klasse welle oben ihre Status-Deckung — unsichtbar, weil diese Datei
  # nur an einem freien Pfad geschrieben wird. Wer die Ausnahme braucht, setzt sie in
  # seiner eigenen Kopie; bis dahin ist die Deckung die strengere Vorgabe.
  exempt-paths: ["docs/plan/adr/README.md", "docs/reviews/**"]
  exclude-sections: [Geschichte]
