# Architecture fitness functions for pgwire-recorder.
# Roles and directions follow the terminology in ARCHITECTURE.md:
# Driving Adapter -> Inbound Port; Outbound Port -> Driven Adapter.
version: 1

languages:
  go: ["**/*.go"]

layers:
  model:
    globs: ["internal/hexagon/model/**"]
    role: domain

  services:
    globs: ["internal/hexagon/services/**"]
    role: app

  ports-driving:
    globs: ["internal/hexagon/ports/driving/**"]
    role: port
    direction: inbound

  ports-driven:
    globs: ["internal/hexagon/ports/driven/**"]
    role: port
    direction: outbound

  adapters-driving:
    globs: ["internal/adapters/driving/**"]
    role: adapter
    direction: driving

  adapters-driven:
    globs: ["internal/adapters/driven/**"]
    role: adapter
    direction: driven

edges:
  - {from: services,         to: model}
  - {from: services,         to: ports-driven}
  - {from: ports-driving,    to: model}
  - {from: ports-driven,     to: model}
  - {from: adapters-driving, to: ports-driving}
  - {from: adapters-driving, to: model}
  - {from: adapters-driven,  to: ports-driven}
  - {from: adapters-driven,  to: model}

tech:
  - {pattern: "github.com/jackc/pgx/v5/pgproto3", adapter: ["internal/adapters/driving/pgwire", "internal/adapters/driven/postgres"]}
  - {pattern: "go.yaml.in/yaml", adapter: ["internal/adapters/driven/recording", "internal/adapters/driving/cli"]}
  - {pattern: "gopkg.in/yaml", adapter: ["internal/adapters/driven/recording", "internal/adapters/driving/cli"]}
  - {pattern: "modernc.org/sqlite", adapter: "internal/adapters/driven/recording"}
  # Grenze: die Regel greift am Import, nicht am Aufruf; auch ein Zeittyp ohne Aufruf
  # ist im Kern abgelehnt (LH-FA-21.a *Uhr*). `^time$` trifft nur das Paket `time`,
  # nicht `runtime`. Jeder Eintrag der Liste steht für Dateien, die `time` einbinden:
  # die Adapter, die Integrationstests unter test/ und je eine Testhilfe. Der
  # Composition Root steht nicht darin; `composition_root` nimmt ihn von der Regel aus.
  - {pattern: "^time$", match: regex, adapter: ["internal/adapters", "test/", "internal/testuhr", "internal/testzeit", "internal/testpki"]}
  - {pattern: "crypto/tls", adapter: ["internal/adapters/driving/pgwire", "internal/adapters/driven/postgres"]}

composition_root:
  - "cmd/**"
  - "internal/bootstrap/**"

markers:
  ignore_symbols: []
